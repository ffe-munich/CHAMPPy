[build-system]
requires = ["hatchling >= 1.6.0"]
build-backend = "hatchling.build"

[project]
name = "champpy"
version = "0.1.3"
description = "CHAMPPy - Mobility and Charging Profiles in Python"
authors = [{name = "Florian Biedenbach", email = "fbiedenbach@ffe.de"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.0",
    "numpy>=1.0",
    "pandera[strategies]>=0.15",
    "tqdm>=4.0",
    "scipy>=1.7",
    "pyarrow",
    "plotly>=5.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

keywords = ["electric vehicles", "charging","mobility profiles", "charging profiles", "markov process"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/ffe-munich/CHAMPPy"
Issues = "https://github.com/ffe-munich/CHAMPPy/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "nbconvert>=7.0",
    "pylint>=2.0",
]

docs = [
    "sphinx>=9.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autodoc-typehints>=2.0",
    "myst-nb>=1.0",
    "furo>=2024.0",
    "sphinx-tabs>=3.5.0",
]

[tool.hatchling.build.targets.wheel]
packages = ["src/champpy"]

[tool.hatchling.build.include]
# Include all files in this folder
"src/champpy/data/**" = "src/champpy/data/**"

[tool.champpy]
# Default output directory for plots
plot_dir = "plots"